name: Daily Catering Pulse & Auto-Indexing Pipeline

on:
  schedule:
    # Runs daily at 20:47 UTC (03:47 AM Phnom Penh Time ICT / 04:47 AM Taipei Time)
    # Off-peak UTC hour (20:xx UTC) & non-standard minute (47) to eliminate GitHub Actions queue congestion
    - cron: '47 20 * * *'
  workflow_dispatch:

jobs:
  update-pulse-and-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Catering Pulse RSS Miner & AI Localizer (1 Article Per Day)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/fetch_catering_pulse.py

      - name: Build Project & Generate Static Assets
        run: npm run build

      - name: Run IndexNow & GSC Search Engine Submission
        run: python scripts/notify_indexing.py

      - name: Deploy to Cloudflare Pages (Direct Deployment if Secret Configured)
        uses: cloudflare/pages-action@v1
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ckmkh
          directory: dist

      - name: Commit & Push Generated Pulse Data & IndexNow Assets (Triggers Cloudflare Pages Auto-Deploy)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/pulseData.json public/*.txt public/images/pulse/*
          if git diff --staged --quiet; then
            echo "No new pulse data updates to commit."
          else
            git commit -m "chore(pulse): auto-update daily catering pulse & indexnow key"
            git push origin main
          fi

