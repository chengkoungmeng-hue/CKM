name: Daily Catering Pulse & Auto-Indexing Pipeline

on:
  schedule:
    # ONE run a day, at the morning Phnom Penh slot. Non-round minutes stay out of the
    # GitHub Actions scheduling stampede.
    #
    # 20:47 UTC = 03:47 ICT (Phnom Penh) the following day.
    #
    # Dropped from twice daily to once on 2026-08-22 (owner directive: one article a
    # day, five banquet topics and two food items per week). The second slot at
    # 08:47 UTC was removed rather than kept as a retry: a second run publishes a
    # SECOND article, it does not re-attempt the first, so keeping it would have made
    # the cadence 14 a week against a directive of 7.
    #
    # This is also what makes fetch_catering_pulse.py's 5:2 rotation exact. The slot is
    # derived from the Phnom Penh calendar date, so one run per local date gives five
    # banquet articles and two food articles per week; two runs a day would have put two
    # articles into the same slot and skewed the ratio inside every week.
    #
    # The run still publishes exactly ONE article and takes the whole verified path:
    # fetch or seed, generate, validate, commit, then publish.yml waits for the page to
    # be live before purging and indexing. The `concurrency` group below still
    # serialises a scheduled run against a manual dispatch.
    - cron: '47 20 * * *'
  workflow_dispatch:

# A scheduled run and a manual dispatch overlapping would produce two commits
# racing for the same branch, and two Cloudflare builds racing for the same
# deployment. Serialise them.
concurrency:
  group: daily-catering-pulse
  cancel-in-progress: false

jobs:
  update-pulse-and-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install Pillow requests google-auth

      # NOTE: no Node.js / npm ci step. Nothing in this pipeline runs JavaScript —
      # the site is built by Cloudflare Pages, not here. Installing Node 22 and
      # running a full `npm ci` cost ~40-60s per run and produced nothing.

      - name: Fetch one new pulse article and localize it
        id: pulse
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python devops/fetch_catering_pulse.py

      # Gemini has previously returned Khmer text with Thai and Chinese fragments
      # spliced in. Those cannot render in Hanuman and shipped as tofu boxes.
      # The generator now rejects them, and this is the belt-and-braces check
      # across the whole content tree before anything is committed.
      # llms.txt indexes every article and pulse note, so it goes stale by one entry a
      # day unless it is regenerated with them. Both files previously had no generator
      # at all and had drifted to containing zero of the site's 42 URLs.
      - name: Regenerate llms.txt from the new content
        if: steps.pulse.outputs.changed == 'true'
        run: python devops/generate_llms_txt.py

      - name: Validate content before publishing
        if: steps.pulse.outputs.changed == 'true'
        run: python devops/check_content.py --strict

      - name: Commit & push (triggers Cloudflare Pages deployment)
        id: commit
        if: steps.pulse.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add src/data/pulseData.json
          # These paths may legitimately be empty; --ignore-unmatch keeps the
          # step from aborting when the generator produced no new assets.
          git add --all -- public/images/pulse 2>/dev/null || true
          for f in public/*.txt; do [ -e "$f" ] && git add "$f"; done

          if git diff --staged --quiet; then
            echo "Nothing staged after all — skipping."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore(pulse): add ${{ steps.pulse.outputs.new_slug }}"
          # Another job may have pushed while this one was calling the Gemini API.
          git pull --rebase origin main
          git push origin main
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      # Deployment, cache purge and indexing are deliberately NOT here. The push
      # above is picked up by .github/workflows/publish.yml, which waits for the
      # new slug to be live, purges the edge, then submits to IndexNow and
      # Search Console.
      #
      # Keeping them separate means a hand-written article gets published the
      # same way a generated one does, instead of going unindexed until the next
      # pulse run happens to resubmit the whole URL list.

      - name: Summary
        if: always()
        run: |
          {
            echo "### Daily Catering Pulse"
            echo ""
            echo "| step | result |"
            echo "| :--- | :--- |"
            echo "| new article | \`${{ steps.pulse.outputs.changed }}\` (${{ steps.pulse.outputs.reason }}${{ steps.pulse.outputs.new_slug }}) |"
            echo "| slot | \`${{ steps.pulse.outputs.slot }}\` |"
            echo "| supply left | \`${{ steps.pulse.outputs.queue_depth }}\` (unused seeds on a banquet day, unseen feed items on a food day) |"
            echo "| archive depth reached | \`${{ steps.pulse.outputs.archive_depth }}\` |"
            echo "| pushed | \`${{ steps.commit.outputs.pushed }}\` |"
            echo "| publishing | handed to publish.yml |"
          } >> "$GITHUB_STEP_SUMMARY"

      # The failure mode that actually matters for an unattended pipeline is not a red
      # run -- a red run sends mail. It is a GREEN run that published nothing, repeated
      # until the site has quietly stopped updating. Several paths do exactly that: no
      # unseen candidate, every candidate URL dead, Gemini rejecting all three attempts,
      # the API budget exhausted, a model retired.
      #
      # Rather than alarm on each cause, this checks the outcome -- how long since
      # anything reached the dataset -- which covers all of them at once, including
      # causes not yet imagined. It runs last and with always(), so it can never block a
      # publish that did succeed; it only turns a silent stall into a failed run, which
      # is the thing that actually reaches a human.
      # The threshold was tightened from 3 days to 2 when the cadence was twice daily,
      # where 2 days meant four consecutive failures. The cadence went back to once a
      # day on 2026-08-22, so 2 days now means TWO consecutive failures — the same
      # threshold, half the rope. Left at 2 deliberately: with a two-model ladder, three
      # quality attempts and a multi-candidate fallback, two whole days producing
      # nothing is a real fault and not a run of bad luck. Raise it to 3 if it ever
      # fires on a day that recovered by itself.
      - name: Stall detector
        if: always()
        run: python devops/check_pulse_health.py --max-age-days 2
