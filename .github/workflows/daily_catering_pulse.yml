name: Daily Catering Pulse & Auto-Indexing Pipeline

on:
  schedule:
    # Runs daily at 20:47 UTC (03:47 AM Phnom Penh Time ICT / 04:47 AM Taipei Time)
    # Off-peak UTC hour (20:xx UTC) & non-standard minute (47) to eliminate GitHub Actions queue congestion
    - cron: '47 20 * * *'
  workflow_dispatch:

jobs:
  update-pulse-and-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install Pillow

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Catering Pulse RSS Miner & AI Localizer (1 Article Per Day)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/fetch_catering_pulse.py

      - name: Commit & Push Generated Pulse Data & IndexNow Assets (Triggers Cloudflare Pages Auto-Deploy)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/pulseData.json public/*.txt public/images/pulse/*
          if git diff --staged --quiet; then
            echo "No new pulse data updates to commit."
          else
            git commit -m "chore(pulse): auto-update daily catering pulse & indexnow key"
            git push origin main
          fi

      - name: Wait for Cloudflare Deployment, Purge Edge Cache & Trigger Auto-Indexing
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "Waiting 35 seconds for Cloudflare Pages live deployment to complete..."
          sleep 35
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Purging Cloudflare Edge Cache for Zone d459c80e06d000c6e1927783fc6b3a7a (ckmkh.com)..."
            curl -X POST "https://api.cloudflare.com/client/v4/zones/d459c80e06d000c6e1927783fc6b3a7a/purge_cache" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}'
          else
            echo "CLOUDFLARE_API_TOKEN secret is not set. Skipping cache purge."
          fi
          python scripts/notify_indexing.py


