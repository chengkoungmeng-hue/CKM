name: Probe pulse card rendering

# TEMPORARY probe. Renders sample /pulse/ cards on the Linux runner, where Pillow
# has the raqm backend Khmer shaping needs (measured 2026-08-22: raqm 0.10.5,
# shaped/naive advance ratio 0.556 -- subscripts stack). Windows wheels report
# raqm=False, so a local render proves nothing and this is the only way to look
# at the real output. Delete once the card style is signed off.

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install --upgrade pip Pillow

      - name: Confirm shaping is active before trusting the render
        run: |
          python - <<'PY'
          from PIL import features
          import PIL, sys
          ok = features.check("raqm")
          print("pillow:", PIL.__version__, "raqm:", ok)
          if not ok:
              sys.exit("raqm unavailable on this runner; cards would render unshaped")
          PY

      - name: Render sample cards
        run: python devops/render_pulse_card.py --sample --out probe_out

      - name: Upload cards
        uses: actions/upload-artifact@v4
        with:
          name: pulse-cards-sample
          path: probe_out/*.png
          retention-days: 3
