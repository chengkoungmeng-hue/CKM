name: Verify Credentials

# Manual-only. Proves that the CI secrets actually work, without waiting for the daily
# pulse to produce a new article.
#
# Both the Search Console submission and the Cloudflare purge live inside a step gated on
# `if: steps.wait.outputs.live == 'true'` in daily_catering_pulse.yml, itself downstream of
# the pulse having changed. On a day the RSS feed yields nothing, that step never runs and
# the workflow still reports success — so a green pulse run does NOT prove a rotated
# credential works. Run this after every rotation instead.
#
# Both jobs are idempotent: re-submitting the same sitemap and purging an already-purged
# cache are both no-ops. Neither prints a secret.

on:
  workflow_dispatch:

concurrency:
  group: verify-credentials
  cancel-in-progress: false

jobs:
  search-console:
    name: Search Console (SEARCH_CONSOLE_SA_JSON)
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: pip install --quiet google-auth

      - name: Authenticate and submit sitemap
        env:
          SEARCH_CONSOLE_SA_JSON: ${{ secrets.SEARCH_CONSOLE_SA_JSON }}
        run: |
          if [ -z "${SEARCH_CONSOLE_SA_JSON:-}" ]; then
            echo "::error::SEARCH_CONSOLE_SA_JSON is not set"
            exit 1
          fi
          printf '%s' "$SEARCH_CONSOLE_SA_JSON" > sa.json
          python - <<'PY'
          import json, sys, urllib.error, urllib.parse, urllib.request
          from google.auth.transport.requests import Request
          from google.oauth2 import service_account

          SITE = "sc-domain:ckmkh.com"
          SITEMAP = "https://ckmkh.com/sitemap-index.xml"

          # client_email and private_key_id are identifiers shown in the Cloud console,
          # not secrets. The private key is never read or printed.
          with open("sa.json", encoding="utf-8") as fh:
              meta = json.load(fh)
          print(f"account : {meta.get('client_email')}")
          print(f"key id  : {meta.get('private_key_id')}")

          creds = service_account.Credentials.from_service_account_file(
              "sa.json", scopes=["https://www.googleapis.com/auth/webmasters"]
          )
          creds.refresh(Request())
          headers = {"Authorization": f"Bearer {creds.token}"}
          print("auth    : OK")

          def call(url, method="GET"):
              req = urllib.request.Request(url, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      return resp.status, resp.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read().decode("utf-8", "replace")

          # 1. Property access — fails if the account was never added in Search Console.
          status, body = call("https://www.googleapis.com/webmasters/v3/sites")
          if status != 200:
              sys.exit(f"::error::listing properties failed with {status}: {body}")
          sites = [s["siteUrl"] for s in json.loads(body).get("siteEntry", [])]
          print(f"sites   : {sites}")
          if SITE not in sites:
              sys.exit(f"::error::{SITE} not in this account's properties — add it in Search Console")

          # 2. Write capability. Re-submitting the same sitemap is a no-op, so this is safe
          #    to repeat. Restricted permission fails here with 403; Full succeeds.
          url = (
              f"https://www.googleapis.com/webmasters/v3/sites/"
              f"{urllib.parse.quote(SITE, safe='')}/sitemaps/{urllib.parse.quote(SITEMAP, safe='')}"
          )
          status, body = call(url, method="PUT")
          if status not in (200, 204):
              sys.exit(f"::error::sitemap submit failed with {status}: {body} "
                       "(403 usually means the account has Restricted, not Full, permission)")
          print(f"sitemap : submitted OK ({status})")
          print("\nCredential is valid and has Full permission.")
          PY

      - name: Remove credential file
        if: always()
        run: rm -f sa.json

  gemini:
    name: Gemini (GEMINI_API_KEY)
    runs-on: ubuntu-latest
    steps:
      - name: Verify key against the model ladder
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::error::GEMINI_API_KEY is not set"
            exit 1
          fi
          python - <<'PY'
          import json, os, sys, urllib.error, urllib.request

          # Mirrors MODEL_LADDER in scripts/fetch_catering_pulse.py. The pipeline falls
          # through the list, so the key only has to satisfy one of them.
          LADDER = ["gemini-3.6-flash", "gemini-3.7-flash",
                    "gemini-3.5-flash", "gemini-3.5-flash-lite"]
          BASE = "https://generativelanguage.googleapis.com/v1beta"

          # Header, never `?key=` — a key in the query string reaches proxy logs, and
          # urllib exceptions stringify the URL.
          key = os.environ["GEMINI_API_KEY"].strip().strip("\"'").strip()
          if not key:
              sys.exit("::error::GEMINI_API_KEY is empty after trimming")
          headers = {"Content-Type": "application/json", "x-goog-api-key": key}

          def call(url, payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(url, data=data, headers=headers,
                                           method="POST" if data else "GET")
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return resp.status, json.loads(resp.read().decode())
              except urllib.error.HTTPError as exc:
                  return exc.code, json.loads(exc.read().decode() or "{}")

          # 1. Auth. Listing models consumes no generation quota.
          status, body = call(f"{BASE}/models")
          if status != 200:
              sys.exit(f"::error::key rejected ({status}): {body.get('error', {}).get('message')}")
          available = {m["name"].split("/")[-1] for m in body.get("models", [])}
          print(f"auth    : OK ({len(available)} models visible)")

          # 2. Generation. Auth alone does not prove the key can actually produce output —
          #    quota can be zero for a model while the key stays valid.
          for model in LADDER:
              if model not in available:
                  print(f"  {model}: not available to this key")
                  continue
              status, body = call(
                  f"{BASE}/models/{model}:generateContent",
                  {"contents": [{"parts": [{"text": "Reply with the single word OK."}]}],
                   "generationConfig": {"maxOutputTokens": 8}},
              )
              if status == 200:
                  print(f"  {model}: generate OK")
                  print("\nKey is valid and at least one ladder model can generate.")
                  break
              reason = body.get("error", {}).get("message", "")[:120]
              print(f"  {model}: {status} {reason}")
          else:
              sys.exit("::error::no model in MODEL_LADDER could generate — "
                       "the key authenticates but has no usable quota")
          PY

  cloudflare:
    name: Cloudflare (CLOUDFLARE_API_TOKEN)
    runs-on: ubuntu-latest
    steps:
      - name: Verify token and purge cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set"
            exit 1
          fi
          python - <<'PY'
          import json, os, sys, urllib.error, urllib.request

          # Match notify_indexing.py: a secret pasted with a trailing newline or stray
          # quotes produces an illegal header value and fails before the request is sent.
          token = os.environ["CLOUDFLARE_API_TOKEN"].strip().strip("\"'").strip()
          if not token:
              sys.exit("::error::CLOUDFLARE_API_TOKEN is empty after trimming")

          ZONE = "d459c80e06d000c6e1927783fc6b3a7a"
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          def call(url, payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(url, data=data, headers=headers,
                                           method="POST" if data else "GET")
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      return resp.status, json.loads(resp.read().decode())
              except urllib.error.HTTPError as exc:
                  return exc.code, json.loads(exc.read().decode() or "{}")

          # 1. Is this a scoped API token at all? A Global API Key fails this endpoint.
          status, body = call("https://api.cloudflare.com/client/v4/user/tokens/verify")
          if not body.get("success"):
              sys.exit(f"::error::token verify failed ({status}): {body.get('errors')} "
                       "— a Global API Key will fail here; use a scoped API token")
          result = body.get("result", {})
          # The token id is an identifier, shown in the Cloudflare dashboard — not the
          # token itself. Printing it is what proves *which* token the secret holds; a
          # green purge alone does not, since the token being replaced could also purge.
          print(f"token id: {result.get('id')}")
          print(f"token   : {result.get('status')}")
          print(f"expires : {result.get('expires_on') or 'never'}")

          # 2. The capability CI actually needs. Purging an already-fresh cache is a no-op.
          status, body = call(
              f"https://api.cloudflare.com/client/v4/zones/{ZONE}/purge_cache",
              {"purge_everything": True},
          )
          if not body.get("success"):
              sys.exit(f"::error::cache purge failed ({status}): {body.get('errors')}")
          print("purge   : OK")
          print("\nToken is valid and can purge the zone cache.")
          PY

  analytics:
    name: Analytics (ANALYTICS_SA_JSON)
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: pip install --quiet google-auth

      - name: Authenticate and read the property
        env:
          ANALYTICS_SA_JSON: ${{ secrets.ANALYTICS_SA_JSON }}
        run: |
          if [ -z "${ANALYTICS_SA_JSON:-}" ]; then
            echo "::error::ANALYTICS_SA_JSON is not set"
            exit 1
          fi
          printf '%s' "$ANALYTICS_SA_JSON" > ga4.json
          python - <<'PY'
          import json, sys, urllib.error, urllib.request
          from google.auth.transport.requests import Request
          from google.oauth2 import service_account

          # The Admin API is not enabled on this project, so the property cannot be
          # discovered -- it is addressed directly. Recorded in AGENTS.md alongside
          # the account that holds Viewer on it.
          PROPERTY = "534450350"

          with open("ga4.json", encoding="utf-8") as fh:
              meta = json.load(fh)
          print(f"account : {meta.get('client_email')}")
          print(f"key id  : {meta.get('private_key_id')}")

          creds = service_account.Credentials.from_service_account_file(
              "ga4.json", scopes=["https://www.googleapis.com/auth/analytics.readonly"]
          )
          creds.refresh(Request())
          print("auth    : OK")

          # Auth alone proves nothing about access: the Data API answers 403 for a
          # valid key that was never granted Viewer on the property.
          req = urllib.request.Request(
              f"https://analyticsdata.googleapis.com/v1beta/properties/{PROPERTY}:runReport",
              data=json.dumps({
                  "dateRanges": [{"startDate": "7daysAgo", "endDate": "yesterday"}],
                  "metrics": [{"name": "sessions"}],
              }).encode(),
              headers={"Authorization": f"Bearer {creds.token}",
                       "Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                  body = json.loads(resp.read().decode())
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode("utf-8", "replace")[:300]
              sys.exit(f"::error::report failed with {exc.code}: {detail} "
                       "(403 usually means the account is not a Viewer on the property)")

          rows = body.get("rows", [])
          sessions = rows[0]["metricValues"][0]["value"] if rows else "0"
          print(f"report  : property {PROPERTY} returned {sessions} sessions over 7 days")
          print("\nCredential is valid and can read the property.")
          PY

      - name: Remove credential file
        if: always()
        run: rm -f ga4.json
