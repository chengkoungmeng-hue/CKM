<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C378" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#997736" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="#171717" />

  <!-- Outer Fine Ring -->
  <circle cx="256" cy="256" r="224" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.85" />
  
  <!-- Inner Ring -->
  <circle cx="256" cy="256" r="212" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.5" />

  <!-- 4-point decorative diamonds -->
  <path d="M 256 24 L 262 32 L 256 40 L 250 32 Z" fill="url(#goldGrad)" />
  <path d="M 256 472 L 262 480 L 256 488 L 250 480 Z" fill="url(#goldGrad)" />
  <path d="M 24 256 L 32 250 L 40 256 L 32 262 Z" fill="url(#goldGrad)" />
  <path d="M 472 256 L 480 250 L 488 256 L 480 262 Z" fill="url(#goldGrad)" />

  <!-- CKM Intertwining Monogram Artwork -->
  <g filter="url(#subtleGlow)" fill="url(#goldGrad)">
    <!-- Letter C -->
    <path d="M 230 175 C 215 165 195 160 170 160 C 115 160 78 200 78 256 C 78 312 115 352 170 352 C 195 352 215 347 230 337 L 222 312 C 208 322 192 326 172 326 C 132 326 106 298 106 256 C 106 214 132 186 172 186 C 192 186 208 190 222 200 Z" />
    
    <!-- Letter K (Main Stem & Legs) -->
    <!-- K Stem -->
    <path d="M 195 150 L 235 150 L 235 165 L 222 165 L 222 347 L 235 347 L 235 362 L 195 362 L 195 347 L 208 347 L 208 165 L 195 165 Z" />
    <!-- K Upper Diagonal -->
    <path d="M 216 265 L 290 165 L 275 165 L 275 150 L 325 150 L 325 165 L 305 165 L 238 254 L 216 265 Z" />
    <!-- K Lower Leg with elegant curve -->
    <path d="M 230 242 L 315 347 L 335 347 L 335 362 L 285 362 L 285 347 L 298 347 L 222 254 Z" />

    <!-- Letter M -->
    <!-- M Left Stem -->
    <path d="M 295 185 L 325 185 L 325 198 L 315 198 L 315 347 L 325 347 L 325 362 L 285 362 L 285 347 L 295 347 L 295 198 L 285 198 L 285 185 Z" />
    <!-- M Center V -->
    <path d="M 315 198 L 365 315 L 375 315 L 425 198 L 425 347 L 435 347 L 435 362 L 400 362 L 400 347 L 410 347 L 410 225 L 372 325 L 368 325 L 328 225 L 328 347 L 338 347 L 338 362 L 298 362 L 298 347 L 308 347 L 308 198 Z" />
    <!-- M Right Stem -->
    <path d="M 410 185 L 445 185 L 445 198 L 435 198 L 435 347 L 445 347 L 445 362 L 405 362 L 405 347 L 415 347 L 415 198 L 405 198 L 405 185 Z" />
  </g>
</svg>
